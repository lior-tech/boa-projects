:root{--deep:#162923;--green:#233B34;--cream:#FAF7F1;--gold:#B8A576;--pale:#B8C7C1}

body{min-height:100vh;background:var(--deep);display:flex;align-items:center;justify-content:center;

input{width:100%;background:rgba(250,247,241,.06);border:1px solid rgba(184,165,118,.4);color:var(--cream);

input:focus{border-color:var(--gold)}
button{margin-top:14px;width:100%;padding:13px;background:var(--gold);border:none;color:var(--deep);
 font-weight:700;font-size:11px;letter-spacing:.32em;cursor:pointer;text-transform:uppercase}
button:hover{background:#C9B689}
.err{margin-top:14px;font-size:11px;letter-spacing:.14em;color:#D89A8E;min-height:16px}
.busy{margin-top:14px;font-size:10px;letter-spacing:.3em;color:var(--pale);min-height:14px}
.ft{margin-top:44px;font-size:9px;letter-spacing:.22em;color:#6E7A74}
